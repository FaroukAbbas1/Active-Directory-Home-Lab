<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546E7A"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#FAFAFA"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#263238">HomeLab Network Topology</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#607D8B">homelab.local — Host-Only Network (vboxnet0)</text>

  <!-- Internet cloud -->
  <ellipse cx="500" cy="110" rx="75" ry="32" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" font-size="14" fill="#37474F">Internet</text>

  <!-- Host NAT line -->
  <line x1="500" y1="142" x2="500" y2="185" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="520" y="168" font-size="11" fill="#78909C">NAT (per-VM Adapter 1)</text>

  <!-- Host-Only Switch -->
  <rect x="330" y="185" width="340" height="50" rx="6" fill="#37474F"/>
  <text x="500" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">vboxnet0 — Host-Only Switch</text>
  <text x="500" y="224" text-anchor="middle" font-size="12" fill="#CFD8DC">192.168.56.0/24</text>

  <!-- Lines down to devices -->
  <line x1="410" y1="235" x2="140" y2="300" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="235" x2="390" y2="300" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="235" x2="620" y2="300" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="235" x2="860" y2="300" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DC01 -->
  <rect x="40" y="300" width="200" height="95" rx="8" fill="#1565C0"/>
  <text x="140" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">DC01</text>
  <text x="140" y="347" text-anchor="middle" font-size="11" fill="#BBDEFB">Domain Controller</text>
  <text x="140" y="363" text-anchor="middle" font-size="11" fill="#E3F2FD">AD DS · DNS · DHCP</text>
  <text x="140" y="381" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">192.168.56.102 (Static)</text>

  <!-- FILE01 -->
  <rect x="290" y="300" width="200" height="95" rx="8" fill="#2E7D32"/>
  <text x="390" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">FILE01</text>
  <text x="390" y="347" text-anchor="middle" font-size="11" fill="#C8E6C9">File Server</text>
  <text x="390" y="363" text-anchor="middle" font-size="11" fill="#E8F5E9">Shares · NTFS Perms</text>
  <text x="390" y="381" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">192.168.56.103 (Static)</text>

  <!-- CLIENT01 -->
  <rect x="520" y="300" width="200" height="95" rx="8" fill="#5E35B1"/>
  <text x="620" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">CLIENT01</text>
  <text x="620" y="347" text-anchor="middle" font-size="11" fill="#D1C4E9">Windows 11 — Employee PC</text>
  <text x="620" y="363" text-anchor="middle" font-size="11" fill="#EDE7F6">Domain-Joined</text>
  <text x="620" y="381" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">DHCP (110-200 range)</text>

  <!-- CLIENT02 -->
  <rect x="760" y="300" width="200" height="95" rx="8" fill="#5E35B1"/>
  <text x="860" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">CLIENT02</text>
  <text x="860" y="347" text-anchor="middle" font-size="11" fill="#D1C4E9">Windows 11 — Employee PC</text>
  <text x="860" y="363" text-anchor="middle" font-size="11" fill="#EDE7F6">Domain-Joined</text>
  <text x="860" y="381" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">DHCP — 192.168.56.111</text>

  <!-- Divider -->
  <line x1="40" y1="435" x2="960" y2="435" stroke="#CFD8DC" stroke-width="1"/>
  <text x="500" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Active Directory — Organizational Structure</text>

  <!-- Domain root -->
  <rect x="420" y="485" width="160" height="42" rx="6" fill="#455A64"/>
  <text x="500" y="511" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">homelab.local</text>

  <!-- lines to OUs -->
  <line x1="500" y1="527" x2="140" y2="565" stroke="#90A4AE" stroke-width="1.3"/>
  <line x1="500" y1="527" x2="380" y2="565" stroke="#90A4AE" stroke-width="1.3"/>
  <line x1="500" y1="527" x2="620" y2="565" stroke="#90A4AE" stroke-width="1.3"/>
  <line x1="500" y1="527" x2="860" y2="565" stroke="#90A4AE" stroke-width="1.3"/>

  <!-- OU boxes -->
  <g>
    <rect x="40" y="565" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.3"/>
    <rect x="40" y="565" width="200" height="34" rx="8" fill="#0277BD"/>
    <text x="140" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">IT OU</text>
    <text x="140" y="618" text-anchor="middle" font-size="11" fill="#37474F">Group: IT-Team</text>
    <text x="140" y="636" text-anchor="middle" font-size="11" fill="#37474F">User: Ahmed Alaa</text>
    <text x="140" y="656" text-anchor="middle" font-size="11" fill="#546E7A">Share: \\FILE01\IT$</text>
    <text x="140" y="674" text-anchor="middle" font-size="11" fill="#546E7A">Mapped Drive: Z:</text>
    <text x="140" y="694" text-anchor="middle" font-size="10" fill="#78909C">No extra restrictions (full access)</text>
  </g>

  <g>
    <rect x="280" y="565" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.3"/>
    <rect x="280" y="565" width="200" height="34" rx="8" fill="#AD1457"/>
    <text x="380" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">HR OU</text>
    <text x="380" y="618" text-anchor="middle" font-size="11" fill="#37474F">Group: HR-Team</text>
    <text x="380" y="636" text-anchor="middle" font-size="11" fill="#37474F">User: Amer Ahmed</text>
    <text x="380" y="656" text-anchor="middle" font-size="11" fill="#546E7A">Share: \\FILE01\HR$</text>
    <text x="380" y="674" text-anchor="middle" font-size="11" fill="#546E7A">Mapped Drive: X:</text>
    <text x="380" y="694" text-anchor="middle" font-size="10" fill="#78909C">GPO: Control Panel · USB disabled</text>
  </g>

  <g>
    <rect x="520" y="565" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.3"/>
    <rect x="520" y="565" width="200" height="34" rx="8" fill="#EF6C00"/>
    <text x="620" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Finance OU</text>
    <text x="620" y="618" text-anchor="middle" font-size="11" fill="#37474F">Group: Finance-Team</text>
    <text x="620" y="636" text-anchor="middle" font-size="11" fill="#37474F">User: Finance User</text>
    <text x="620" y="656" text-anchor="middle" font-size="11" fill="#546E7A">Share: \\FILE01\Finance$</text>
    <text x="620" y="674" text-anchor="middle" font-size="11" fill="#546E7A">Mapped Drive: Y:</text>
    <text x="620" y="694" text-anchor="middle" font-size="10" fill="#78909C">GPO: Control Panel · USB disabled</text>
  </g>

  <g>
    <rect x="760" y="565" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.3"/>
    <rect x="760" y="565" width="200" height="34" rx="8" fill="#6A1B9A"/>
    <text x="860" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Management OU</text>
    <text x="860" y="618" text-anchor="middle" font-size="11" fill="#37474F">Group: Management-Team</text>
    <text x="860" y="636" text-anchor="middle" font-size="11" fill="#37474F">User: Management User</text>
    <text x="860" y="656" text-anchor="middle" font-size="11" fill="#546E7A">Share: \\FILE01\Management$</text>
    <text x="860" y="674" text-anchor="middle" font-size="11" fill="#546E7A">Mapped Drive: W:</text>
    <text x="860" y="694" text-anchor="middle" font-size="10" fill="#78909C">GPO: Control Panel · USB disabled</text>
  </g>

  <!-- Footer -->
  <text x="500" y="755" text-anchor="middle" font-size="10.5" fill="#90A4AE">Domain-wide GPOs: Password Policy · Login Banner · Mapped Drives (Item-Level Targeting)   |   Static range 100-109 for servers · DHCP scope 110-200 for clients</text>
</svg>
